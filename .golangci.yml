version: "2"

run:
  timeout: 10m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - errorlint
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign

  settings:
    revive:
      rules:
        - name: dot-imports
          disabled: true
        - name: package-comments
        - name: exported

  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "SA1019:" # ignore deprecated calls to upstream Karpenter APIs during staged migration

formatters:
  enable:
    - gofmt
    - goimports
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/echohello-dev/karpenter-provider-hetzner)
    goimports:
      local-prefixes: github.com/echohello-dev/karpenter-provider-hetzner

  exclusions:
    paths:
      - _test\.go

issues:
  exclude-dirs:
    - charts
    - hack