---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: hcloudnodeclasses.karpenter.hetzner.cloud
spec:
  group: karpenter.hetzner.cloud
  names:
    kind: HCloudNodeClass
    listKind: HCloudNodeClassList
    plural: hcloudnodeclasses
    shortNames:
    - hcnodeclass
    singular: hcloudnodeclass
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          HCloudNodeClass is the Schema for the NodeClass used by Karpenter to know
          how a Hetzner Cloud server should be built when a NodeClaim references it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HCloudNodeClassSpec defines the desired state of HCloudNodeClass.
            properties:
              enablePublicIPv4:
                default: true
                description: |-
                  EnablePublicIPv4 attaches a billed public IPv4 to each server. Set false
                  on private-network clusters to drop the IPv4 charge.
                type: boolean
              enablePublicIPv6:
                default: true
                description: EnablePublicIPv6 attaches a public IPv6 to each server.
                type: boolean
              firewallIDs:
                description: FirewallIDs is the optional list of Hetzner firewalls
                  to attach.
                items:
                  format: int64
                  type: integer
                type: array
              imageSelector:
                description: ImageSelector selects the snapshot to boot from.
                properties:
                  family:
                    description: Family selects the OS family (talos|ubuntu).
                    type: string
                  selector:
                    additionalProperties:
                      type: string
                    description: |-
                      Selector is an optional hcloud-label filter (e.g.
                      {"caph-image-name": "talos-v1.9.5-gvisor"}). All labels must match.
                      Prefer this over Version when pinning an exact snapshot.
                    type: object
                  version:
                    description: |-
                      Version is an optional substring match against the image description
                      (e.g. "v1.9"). Defaults to the newest matching image.
                    type: string
                required:
                - family
                type: object
                x-kubernetes-validations:
                - message: family must be 'talos' or 'ubuntu'
                  rule: (has(self.family) && (self.family == 'talos' || self.family
                    == 'ubuntu'))
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels is the set of labels applied to the Hetzner server at create time.
                  Karpenter-managed labels (karpenter.sh/cluster, karpenter.sh/nodepool)
                  are applied automatically and do not need to be specified here.
                type: object
              locations:
                description: Locations is the list of Hetzner locations nodes may
                  be scheduled into.
                items:
                  type: string
                minItems: 1
                type: array
              networkID:
                description: |-
                  NetworkID is the private network ID nodes should attach to.
                  Required for clusters that place worker traffic on a private network.
                format: int64
                type: integer
              placementGroupStrategy:
                description: |-
                  PlacementGroupStrategy controls whether nodes are spread across physical hosts.
                  Defaults to spread.
                enum:
                - spread
                - none
                type: string
              sshKeyIDs:
                description: SSHKeyIDs is the optional list of SSH keys to install
                  on the server.
                items:
                  format: int64
                  type: integer
                type: array
              userData:
                description: |-
                  UserData is the inline cloud-init (Ubuntu) or Talos machine config blob.
                  Prefer UserDataSecretRef — keeping boot config in git is a foot-gun.
                type: string
              userDataSecretRef:
                description: |-
                  UserDataSecretRef sources userData from a Kubernetes Secret. Takes
                  precedence over Spec.UserData when both are set.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
            required:
            - imageSelector
            - locations
            - networkID
            type: object
            x-kubernetes-validations:
            - message: locations must contain at least one element
              rule: self.locations.size() > 0
          status:
            description: HCloudNodeClassStatus defines the observed state of HCloudNodeClass.
            properties:
              conditions:
                description: Conditions are the readiness signals reported by the
                  controller.
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              resolvedImages:
                description: ResolvedImages is the set of image IDs the provider resolved
                  per architecture.
                items:
                  description: |-
                    ResolvedImage records an image ID that imagefamily.Provider resolved for a
                    NodeClass, keyed by architecture (amd64 | arm64).
                  properties:
                    architecture:
                      type: string
                    imageID:
                      format: int64
                      type: integer
                  required:
                  - architecture
                  - imageID
                  type: object
                type: array
              selectedPlacementGroup:
                description: |-
                  SelectedPlacementGroup is the placement group the NodeClass chose for its
                  servers (when PlacementGroupStrategy = spread).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
