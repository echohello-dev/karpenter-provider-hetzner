---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter-provider-hetzner.fullname" . }}-dns
  namespace: kube-system
  labels:
    {{- include "karpenter-provider-hetzner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
