{{- /*
Token Secret.

We never bake a real token into a Secret from a chart install — that would
mean committing tokens to git. This template renders an EMPTY Secret: the
only `required` value below is clusterName, so a render never fails on a
missing token. What actually happens at install time:

  * Secret does not exist yet (normal path): Helm creates the empty Secret.
    The controller then exits at startup with "HCLOUD_TOKEN environment
    variable is required" until the token is written into it. `kubectl
    create secret` will say AlreadyExists (Helm owns the object), so write
    the key instead:

      kubectl -n <namespace> create secret generic hcloud-token \
        --from-literal=token="$HCLOUD_TOKEN" \
        --dry-run=client -o yaml | kubectl -n <namespace> apply -f -

  * Secret already exists but is not owned by this release (pre-created
    with kubectl): install/upgrade fails with Helm's "invalid ownership
    metadata" error instead of adopting it. Pre-create only if you accept
    that Helm cannot install over it.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-provider-hetzner.labels" . | nindent 4 }}
  annotations:
    karpenter.hetzner.cloud/cluster-name: {{ required "clusterName is required" .Values.clusterName | quote }}
type: Opaque
