{{- /*
Placeholder secret.

We do NOT bake real tokens into a Secret from a chart install — that would
mean committing tokens to git. Instead, this template fails fast on render
unless the user pre-creates the Secret in the right namespace.

Pre-install:

  kubectl create namespace karpenter
  kubectl -n karpenter create secret generic hcloud-token \
    --from-literal=token="$HCLOUD_TOKEN"
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-provider-hetzner.labels" . | nindent 4 }}
  annotations:
    karpenter.hetzner.cloud/cluster-name: {{ required "clusterName is required" .Values.clusterName | quote }}
type: Opaque
