name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - name: Trust mise config
        run: mise trust

      - name: Install dependencies
        run: mise install

      - name: golangci-lint
        run: mise run lint

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
      - run: mise trust
      - run: mise install
      - run: mise run vet

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
      - run: mise trust
      - run: mise install
      - run: mise run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
      - run: mise trust
      - run: mise install
      - run: mise run build

  generate-verify:
    name: Generate verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
      - run: mise trust
      - run: mise install
      - run: mise run generate
      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --porcelain pkg/apis charts/karpenter-provider-hetzner/crds)" ]; then
            echo "::error::Generated files are out of date. Run 'mise run generate' and commit the result."
            git --no-pager diff -- pkg/apis charts/karpenter-provider-hetzner/crds
            exit 1
          fi

  lint-chart:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
      - run: mise trust
      - run: mise install
      - run: mise run lint-chart
