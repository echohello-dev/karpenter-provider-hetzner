name: Release

# Triggered when release-please creates a GitHub Release. goreleaser picks up
# the published tag and publishes multi-arch images, OCI Helm chart, SBOM,
# cosign signatures, and SLSA L3 provenance.

on:
  release:
    types: [published]
  # Re-publish artifacts for a tag that has already been released. The
  # release event fires exactly once per release, and the run it creates uses
  # the workflow file from the tag's own commit — so re-running that job can
  # never pick up a fix made on main afterwards. A dispatch runs this file
  # (from main) and checks out the tag, which is what makes a repair like
  # v2026.9.3's possible at all.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish artifacts for"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Release event: the published tag. Dispatch: the requested tag.
          # Either way goreleaser's HEAD sits on the tag being released.
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
      - run: mise trust
      - run: mise install

      # Pinned, not @v4: cosign-installer publishes v4.0.0..v4.1.2 but no
      # floating v4 tag, so the tag reference fails to resolve and the whole
      # release job dies before it starts.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate CRDs
        run: mise run generate

      - name: Verify generated files are committed
        run: |
          if [ -n "$(git status --porcelain pkg/apis charts/karpenter-provider-hetzner/crds)" ]; then
            echo "::error::Generated files are out of date at release time."
            exit 1
          fi

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          COSIGN_EXPERIMENTAL: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser's ko pipe builds container images from Go binaries, so it
      # cannot publish the Helm chart — helm push is the actual OCI chart
      # path, and it runs after goreleaser (which cleans dist/).
      - name: Publish Helm chart
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          mkdir -p dist
          helm package charts/karpenter-provider-hetzner \
            --version "$chart_version" \
            --app-version "$chart_version" \
            --destination dist
          helm push "dist/karpenter-provider-hetzner-${chart_version}.tgz" oci://ghcr.io/echohello-dev/charts
