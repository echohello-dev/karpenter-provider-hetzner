name: Release

# Triggered when release-please creates a GitHub Release. goreleaser picks up
# the published tag and publishes multi-arch images, OCI Helm chart, SBOM,
# cosign signatures, and SLSA L3 provenance.

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
      - run: mise trust
      - run: mise install

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Generate CRDs
        run: mise run generate

      - name: Verify generated files are committed
        run: |
          if [ -n "$(git status --porcelain pkg/apis charts/karpenter-provider-hetzner/crds)" ]; then
            echo "::error::Generated files are out of date at release time."
            exit 1
          fi

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          COSIGN_EXPERIMENTAL: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
