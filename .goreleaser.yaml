# GoReleaser v2 configuration.
# Produces multi-arch container images, signed checksums, SBOMs, and SLSA L3
# provenance. The OCI Helm chart is published by release.yml itself (helm
# package + helm push) — goreleaser's ko pipe builds container images from Go
# binaries and cannot publish charts.

version: 2

project_name: karpenter-provider-hetzner

before:
  hooks:
    - go mod tidy

builds:
  - id: controller
    main: ./cmd/controller
    binary: karpenter-provider-hetzner
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      # Override the version constant from pkg/version.
      - -X github.com/echohello-dev/karpenter-provider-hetzner/v1/pkg/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - DISTRIBUTION.md

# One image per architecture; the multi-arch tags are assembled by
# docker_manifests below. GoReleaser v2 has no dockers[].images / .tags /
# .platforms — image names are templated per entry and "platform" is one
# entry per goarch.
dockers:
  - id: controller-amd64
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/echohello-dev/{{ .ProjectName }}"
      - "--label=org.opencontainers.image.source=https://github.com/echohello-dev/{{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .CommitDate }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: controller-arm64
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/echohello-dev/{{ .ProjectName }}"
      - "--label=org.opencontainers.image.source=https://github.com/echohello-dev/{{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .CommitDate }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}"
    image_templates:
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-amd64"
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-arm64"
  - name_template: "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-amd64"
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-arm64"
  - name_template: "ghcr.io/echohello-dev/karpenter-provider-hetzner:latest"
    image_templates:
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-amd64"
      - "ghcr.io/echohello-dev/karpenter-provider-hetzner:v{{ .Version }}-arm64"

sboms:
  - id: sbom
    artifacts: binary

signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    output: false
    args:
      # Classic cosign (v2.4.x, pinned in release.yml) — the flags goreleaser
      # expects, writing the .sig/.pem pair next to the checksum file.
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'

nfpms:
  - id: packages
    package_name: karpenter-provider-hetzner
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - deb
      - rpm
    maintainer: echohello-dev <noreply@echohello.dev>
    description: |
      A Karpenter cloud provider for Hetzner Cloud. Provisions, bin-packs,
      and autoscales Hetzner Cloud servers as Kubernetes nodes (Talos+Ubuntu).
    license: Apache-2.0
    section: utils
    priority: optional

release:
  github:
    owner: echohello-dev
    name: karpenter-provider-hetzner
  header: |
    ## karpenter-provider-hetzner {{ .Tag }}

    Multi-arch container image, OCI Helm chart, SBOM, and cosign signatures
    have been published as release assets.

    Install with:

    ```
    helm install karpenter-provider-hetzner \\
      oci://ghcr.io/echohello-dev/charts/karpenter-provider-hetzner \\
      --version {{ .Tag }} \\
      --namespace karpenter \\
      --set clusterName=$CLUSTER_NAME
    ```
  footer: |
    ## Verification

    - SBOM: `{{ .ProjectName }}_{{ .Version }}_sbom.spdx.json`
    - Cosign signatures attached to each image digest.
    - SLSA L3 provenance attached as a GitHub attestation.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore:.*dependabot"
      - "^ci:.*\\bci\\b"
      - "^docs:"
      - "^test:"
  groups:
    - title: "Features"
      regexp: "^feat"
    - title: "Bug fixes"
      regexp: "^fix"
    - title: "Reverts"
      regexp: "^revert"
    - title: "Maintenance"
      regexp: "^(chore|ci|test|build|refactor)(?:\\([^\\)]+\\))?:.*"

milestones:
  - close: true
